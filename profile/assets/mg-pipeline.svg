<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="460" fill="#f4f1ea"/>

  <!-- title -->
  <text x="480" y="42" text-anchor="middle" font-size="20" font-weight="bold" fill="#2b2b2b">Deterministic assurance for Quint - from spec to running code</text>

  <!-- ============ audit pipeline (top row) ============ -->
  <text x="120" y="90" font-size="13" font-weight="bold" fill="#7a6a55">AUDIT ANY QUINT SPEC</text>
  <rect x="30" y="105" width="180" height="56" rx="6" fill="#ffffff" stroke="#b9ac97"/>
  <text x="120" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">any .qnt file</text>
  <text x="120" y="147" text-anchor="middle" font-size="11" fill="#6b6b6b">hand-written or generated</text>

  <line x1="210" y1="133" x2="290" y2="133" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="105" width="180" height="56" rx="6" fill="#2b2b2b"/>
  <text x="380" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">quint-audit</text>
  <text x="380" y="147" text-anchor="middle" font-size="11" fill="#c9c2b4">parse-cost audit, CI gate</text>

  <line x1="470" y1="133" x2="550" y2="133" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="105" width="180" height="56" rx="6" fill="#ffffff" stroke="#b9ac97"/>
  <text x="640" y="128" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">findings</text>
  <text x="640" y="147" text-anchor="middle" font-size="11" fill="#6b6b6b">spans, severities, JSON</text>

  <!-- exit codes badge -->
  <rect x="760" y="112" width="150" height="42" rx="21" fill="#2e7d5b"/>
  <text x="835" y="131" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">exit 0 / 1 / 2</text>
  <text x="835" y="146" text-anchor="middle" font-size="10" fill="#dff0e7">finding vs could-not-run</text>
  <line x1="730" y1="133" x2="760" y2="133" stroke="#2e7d5b" stroke-width="2"/>

  <!-- ============ checktrace pipeline (bottom row) ============ -->
  <text x="120" y="220" font-size="13" font-weight="bold" fill="#7a6a55">CHECK A REAL TRACE</text>

  <rect x="30" y="235" width="180" height="56" rx="6" fill="#ffffff" stroke="#b9ac97"/>
  <text x="120" y="258" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">spec.qnt</text>
  <text x="120" y="277" text-anchor="middle" font-size="11" fill="#6b6b6b">the verified design</text>

  <rect x="30" y="310" width="180" height="56" rx="6" fill="#ffffff" stroke="#b9ac97"/>
  <text x="120" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">trace.itf.json</text>
  <text x="120" y="352" text-anchor="middle" font-size="11" fill="#6b6b6b">your system's real behaviour</text>

  <line x1="210" y1="263" x2="290" y2="338" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="210" y1="338" x2="290" y2="338" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="290" y="310" width="180" height="56" rx="6" fill="#2b2b2b"/>
  <text x="380" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#f4f1ea">quint-checktrace</text>
  <text x="380" y="352" text-anchor="middle" font-size="11" fill="#c9c2b4">invariants at every state</text>

  <line x1="470" y1="338" x2="550" y2="338" stroke="#7a6a55" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="550" y="310" width="180" height="56" rx="6" fill="#ffffff" stroke="#b9ac97"/>
  <text x="640" y="333" text-anchor="middle" font-size="14" font-weight="bold" fill="#2b2b2b">verdict per invariant</text>
  <text x="640" y="352" text-anchor="middle" font-size="11" fill="#6b6b6b">pass, fail, error + JSON record</text>

  <rect x="760" y="317" width="150" height="42" rx="21" fill="#2e7d5b"/>
  <text x="835" y="336" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">exit 0 / 1 / 2</text>
  <text x="835" y="351" text-anchor="middle" font-size="10" fill="#dff0e7">finding vs could-not-run</text>
  <line x1="730" y1="338" x2="760" y2="338" stroke="#2e7d5b" stroke-width="2"/>

  <!-- ============ footer strip ============ -->
  <rect x="30" y="405" width="880" height="36" rx="6" fill="#e7e1d4"/>
  <text x="480" y="428" text-anchor="middle" font-size="12" fill="#5a5245">deterministic - byte-identical findings - stable JSON schema - verified checkers - fails loud, never passes silent</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a6a55"/>
    </marker>
  </defs>
</svg>
